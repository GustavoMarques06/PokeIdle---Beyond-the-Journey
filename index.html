<!doctype html>
<html lang="pt-BR" style="background: #182040">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#284888" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PokéIdle" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="RPG idle de coleção de Pokémon em pixel art." />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>PokéIdle Beyond the Journey</title>
  </head>
  <body>
    <!-- Enquanto o jogo carrega: fundo do jogo e uma Poké Ball girando (nada de página branca). -->
    <div id="root">
      <div class="boot-splash" aria-label="Carregando o jogo">
        <span class="boot-ball"></span>
      </div>
    </div>
    <style>
      .boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 45%, #2c3c78, #182040 70%);
      }
      .boot-ball {
        width: 48px;
        height: 48px;
        border: 4px solid #101828;
        border-radius: 50%;
        background:
          radial-gradient(circle, #fff 0 20%, #101828 21% 32%, transparent 33%),
          linear-gradient(#e83838 0 46%, #101828 46% 54%, #f8f8f8 54%);
        animation: boot-spin 0.8s steps(8, end) infinite;
      }
      @keyframes boot-spin {
        to {
          rotate: 360deg;
        }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
